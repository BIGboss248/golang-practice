services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: # mongodb username
      MONGO_INITDB_ROOT_PASSWORD: # mongodb password
    volumes:
      - ./mongo-data:/data/db
    networks:
      - my_network
  golang:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: # mongodb username
      MONGO_PASS: # mongodb password
      Log_Level: Debug # Set to "Debug" for debug level logging, or leave empty for info level
networks:
  my_network:
    driver: bridge
